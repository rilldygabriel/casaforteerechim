plugins {
    id 'com.android.application'
}

android {
    namespace 'com.casaforteerechim.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.casaforteerechim.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('CASAFORTE_ANDROID_KEYSTORE')
            def signingPassword = System.getenv('CASAFORTE_ANDROID_KEY_PASSWORD')
            if (keyPath && signingPassword) {
                storeFile file(keyPath)
                storePassword signingPassword
                keyAlias 'casaforte-upload'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
