name: CasaForteErechim
options:
  bundleIdPrefix: com.inpeace
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: JK7DDSRXQ9
    CODE_SIGN_STYLE: Automatic
targets:
  CasaForteErechim:
    type: application
    platform: iOS
    sources:
      - CasaForteErechim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inpeace.igrejacasaforteerechim.rs
        PRODUCT_NAME: Casa Forte Erechim
        MARKETING_VERSION: 6.0.1
        CURRENT_PROJECT_VERSION: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Casa Forte
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSCameraUsageDescription: A Casa Forte usa a câmera somente quando você escolhe enviar uma foto ou documento.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: A Casa Forte usa o microfone somente em recursos que você iniciar.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: A Casa Forte acessa suas fotos somente quando você escolhe uma imagem para enviar.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: A Casa Forte usa sua localização somente para confirmar presença em atividades da igreja, quando você solicitar.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
